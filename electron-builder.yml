{
  "appId": "io.lawclaw.next",
  "productName": "LawClaw Next",
  "artifactName": "LawClaw-Next-${version}-${arch}.${ext}",
  "asar": true,
  "electronDist": "node_modules/electron/dist",
  "npmRebuild": false,
  "directories": { "buildResources": "build", "output": "release" },
  "files": ["out/**", "package.json", "!out/**/*.map"],
  "extraResources": [
    { "from": "resources/dsh-runtime", "to": "dsh-runtime", "filter": ["**/*"] },
    { "from": "resources/lawclaw", "to": "lawclaw", "filter": ["**/*"] },
    { "from": "resources/ocr-runtime", "to": "ocr-runtime", "filter": ["**/*"] }
  ],
  "win": {
    "target": [{ "target": "nsis", "arch": ["x64"] }],
    "icon": "build/icon.ico",
    "forceCodeSigning": false
  },
  "nsis": {
    "oneClick": false,
    "allowToChangeInstallationDirectory": true,
    "createDesktopShortcut": true,
    "createStartMenuShortcut": true,
    "shortcutName": "LawClaw Next",
    "deleteAppDataOnUninstall": false
  },
  "publish": null
}
